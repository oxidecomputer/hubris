[package]
name = "task-temperance-demo-client"
version = "0.1.0"
edition = "2024"

[features]
leases = ["temperance-ipc/leases"]

[dependencies]
static-cell = { path = "../../lib/static-cell" }
task-temperance-demo-api = { path = "../temperance-demo-api" }
temperance.workspace = true
temperance-ipc = { path = "../../lib/temperance-ipc" }
userlib = { path = "../../sys/userlib", features = ["panic-messages"] }

[[bin]]
name = "task-temperance-demo-client"
test = false
doctest = false
bench = false

[lints]
workspace = true
