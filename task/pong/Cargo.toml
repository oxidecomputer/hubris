[package]
name = "task-pong"
version = "0.1.0"
edition = "2024"

[features]
panic-messages = ["userlib/panic-messages"]
no-ipc-counters = ["idol/no-counters"]

[dependencies]

drv-user-leds-api = { path = "../../drv/user-leds-api" }
userlib = { path = "../../sys/userlib" }

# Only on the real target; the crate doesn't build for the host.
[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { workspace = true }

[build-dependencies]
build-util = { path = "../../build/util" }
idol.workspace = true

[[bin]]
name = "task-pong"
test = false
doctest = false
bench = false

[lints]
workspace = true
