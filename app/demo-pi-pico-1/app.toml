name = "demo-pi-pico-1"
target = "thumbv6m-none-eabi"
chip = "../../chips/rp2040"
board = "pi-pico-1"
memory = "memory.toml"
stacksize = 944
default-ram = "sram"

[kernel]
name = "demo-pi-pico-1"
requires = {flash = 20000, ram = 1232}
stacksize = 640

[tasks.jefe]
name = "task-jefe"
priority = 0
max-sizes = {flash = 4096, ram = 1024}
start = true
stacksize = 352
notifications = ["fault", "timer"]

[tasks.gpio_driver]
name = "drv-rp2040-gpio"
priority = 1
max-sizes = {flash = 4096, ram = 2048}
start = true
uses = [ "sio", "io_bank0" ]
task-slots = []

[tasks.user_leds]
name = "drv-user-leds"
features = [ "rp2040" ]
priority = 2
max-sizes = {flash = 4096, ram = 1024}
uses = []
start = true
task-slots = [ "gpio_driver" ]
notifications = ["timer"]
config = { blink_at_start = [ "Led::Zero" ] }

[tasks.idle]
name = "task-idle"
priority = 5
max-sizes = {flash = 128, ram = 256}
stacksize = 256
start = true
