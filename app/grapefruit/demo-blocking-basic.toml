# Minimal Grapefruit image running `task-demo-blocking-basic`, the simplest
# blocking counterpart of `task-async-demo` (see async-demo.toml): one fixed
# 250ms tick, with every slower activity counted off it. It behaves
# identically to `task-async-demo` and `task-blocking-demo`; compare their
# sources side by side.
#
# Watch it with:
#
#   humility ringbuf demo_blocking_basic
#   humility ringbuf demo_client
#
name = "grapefruit-demo-blocking-basic"
board = "grapefruit-a"
target = "thumbv7em-none-eabihf"
chip = "../../chips/stm32h7"
default-ram = "axi_sram"
stacksize = 896
epoch = 0
version = 0

[kernel]
name = "grapefruit"
requires = {flash = 32768, ram = 8192}
features = ["measurement-handoff"]
extern-regions = [{ region = "dtcm", shared = true }]

[tasks.jefe]
name = "task-jefe"
priority = 0
max-sizes = {flash = 16384, ram = 4096}
start = true
stacksize = 1536
notifications = ["fault", "timer"]

[tasks.sys]
name = "drv-stm32xx-sys"
features = ["h753"]
priority = 1
max-sizes = {flash = 4096, ram = 2048}
uses = ["rcc", "gpios", "system_flash"]
start = true
task-slots = ["jefe"]

[tasks.user_leds]
name = "drv-user-leds"
features = ["stm32h7"]
priority = 2
max-sizes = {flash = 2048, ram = 1024}
start = true
task-slots = ["sys"]
notifications = ["timer"]

[tasks.demo_blocking_basic]
name = "task-demo-blocking-basic"
priority = 3
max-sizes = {flash = 8192, ram = 4096}
stacksize = 1024
start = true
task-slots = ["user_leds"]
notifications = ["timer", "poke"]

# Must be lower priority than `demo_blocking_basic`, since it sends to it.
[tasks.demo_client]
name = "task-demo-client"
priority = 4
max-sizes = {flash = 8192, ram = 2048}
stacksize = 1024
start = true
task-slots = [{server = "demo_blocking_basic"}]

[tasks.idle]
name = "task-idle"
priority = 5
max-sizes = {flash = 128, ram = 256}
stacksize = 256
start = true
