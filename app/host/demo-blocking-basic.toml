# The basic, fixed-tick blocking counterpart of the hubris-async demo (see
# app/grapefruit/demo-blocking-basic.toml), under the real kernel on the host:
#
#   cargo xtask host-run app/host/demo-blocking-basic.toml --stop-at 20000
#
# Tasks print their trace events to stderr. Time is simulated, and runs as
# fast as possible unless you pass `--realtime`.

# The chip and memory-related settings are ignored in host builds.
name = "host-demo-blocking-basic"
target = "host"
board = "host"
chip = "../../chips/host"
stacksize = 1024

[kernel]
name = "host-demo"
requires = {flash = 0, ram = 0}

[tasks.demo_blocking_basic]
name = "task-demo-blocking-basic"
priority = 3
max-sizes = {flash = 0, ram = 0}
start = true
task-slots = ["user_leds"]
notifications = ["timer", "poke"]

# Must be lower priority than `demo_blocking_basic`, since it sends to it.
[tasks.demo_client]
name = "task-demo-client"
priority = 4
max-sizes = {flash = 0, ram = 0}
start = true
task-slots = [{server = "demo_blocking_basic"}]

# Stands in for the LED driver: a server that answers every request with
# success.
[tasks.user_leds]
name = "task-stub"
priority = 2
max-sizes = {flash = 0, ram = 0}
start = true

[tasks.idle]
name = "task-idle"
priority = 5
max-sizes = {flash = 0, ram = 0}
start = true
